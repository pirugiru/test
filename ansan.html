<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>토론 진행 타이머</title>
<style>
:root{--bg:#0b1020;--panel:#151d35;--text:#f7f9ff;--muted:#aab5d0;--accent:#5e86ff;--warn:#ffbd3d;--danger:#ff5e68;--ok:#59d5a4;--line:rgba(255,255,255,.11)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Pretendard,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}body{display:grid;place-items:center}.screen{width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));aspect-ratio:16/9;padding:2%;display:grid;grid-template-rows:auto 1fr auto;gap:2%;background:radial-gradient(circle at top left,rgba(94,134,255,.18),transparent 32%),var(--bg)}header{display:flex;justify-content:space-between;align-items:center}.kicker{color:#89a7ff;font-size:clamp(14px,1.2vw,22px);font-weight:900}.title{margin:.15em 0 0;font-size:clamp(28px,2.8vw,54px);line-height:1}.fs{border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:14px;padding:.8em 1em;font:inherit;font-weight:900;cursor:pointer}.main{display:grid;grid-template-columns:1.45fr .75fr;gap:2%;min-height:0}.card{background:linear-gradient(180deg,#1b2543,#141c33);border:1px solid var(--line);border-radius:28px;box-shadow:0 20px 55px rgba(0,0,0,.25)}.timer{padding:3%;display:grid;grid-template-rows:auto 1fr auto;transition:background .25s ease,border-color .25s ease}
.card.timer.team-a{background:linear-gradient(145deg,#2f6fed,#17397f)!important;border-color:#8fb0ff}
.card.timer.team-b{background:linear-gradient(145deg,#d84f5b,#7e2730)!important;border-color:#ff9aa2}
.card.timer.team-c{background:linear-gradient(145deg,#1f9d72,#0d5a40)!important;border-color:#83e2bd}
.card.timer.team-d{background:linear-gradient(145deg,#8b5cf6,#4b2a98)!important;border-color:#c4a8ff}
.card.timer.all-teams{background:linear-gradient(145deg,#3c4867,#202a43)!important;border-color:#7180a8}.top{display:flex;justify-content:space-between;align-items:flex-start}.label{color:var(--muted);font-size:clamp(14px,1.2vw,22px);font-weight:800}.team{font-size:clamp(38px,5vw,96px);font-weight:1000;line-height:1;margin-top:.08em}.count{color:var(--muted);font-weight:900;font-size:clamp(14px,1.05vw,19px)}.time{align-self:center;justify-self:center;font-variant-numeric:tabular-nums;font-size:clamp(96px,15vw,285px);font-weight:1000;line-height:.82;letter-spacing:-.07em}.time.warning{color:var(--warn)}.time.danger{color:var(--danger)}.status{text-align:center;color:var(--muted);font-weight:900;font-size:clamp(14px,1.2vw,22px)}.side{padding:6%;display:grid;grid-template-rows:auto auto auto 1fr;gap:5%}.side h3{margin:0 0 .6em;color:var(--muted);font-size:clamp(13px,1vw,18px)}.next{font-size:clamp(30px,3.2vw,62px);font-weight:1000;line-height:1}.seq{display:flex;flex-wrap:wrap;gap:.55em}.pill{padding:.45em .7em;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--muted);font-weight:900}.pill.current{background:var(--accent);color:#fff}.pill.done{opacity:.45;text-decoration:line-through}.duration-setting{display:none;align-items:center;gap:.55em;flex-wrap:wrap}
.duration-setting.show{display:flex}
.duration-setting .duration-label{color:var(--muted);font-weight:900;margin-right:.2em}
.duration-btn{padding:.55em .9em;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;font:inherit;font-weight:900;cursor:pointer}
.duration-btn.active{background:var(--warn);color:#14203a;border-color:transparent}
.notice{align-self:end;padding:1em;border-radius:16px;background:rgba(255,189,61,.09);border:1px solid rgba(255,189,61,.28);color:#ffd980;font-weight:800;line-height:1.45}.controls{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:1%}.controls button,.controls select{min-height:clamp(44px,4.2vw,66px);border-radius:16px;border:1px solid var(--line);font:inherit;font-weight:900;font-size:clamp(13px,1vw,18px)}button{cursor:pointer;background:var(--panel);color:#fff}.primary{background:var(--accent)!important}.green{background:var(--ok)!important;color:#08251a!important}.red{background:rgba(255,94,104,.15)!important;color:#ff9ba3!important}select{background:var(--panel);color:#fff;padding:0 1em}.flash{position:fixed;inset:0;pointer-events:none;background:rgba(255,189,61,.22);opacity:0}.flash.show{animation:flash .7s ease 2}@keyframes flash{50%{opacity:1}}@media(max-aspect-ratio:4/3){.screen{width:100vw;height:100vh;aspect-ratio:auto}}
</style>
</head>
<body>
<div class="screen">
<header><div><div class="kicker" id="kicker"></div><h1 class="title" id="title"></h1></div><button class="fs" id="fs">⛶ 전체 화면</button></header>
<section class="main">
<div class="card timer" id="timerCard"><div class="top"><div><div class="label" id="label"></div><div class="team" id="team"></div></div><div class="count" id="count"></div></div><div class="time" id="time">03:00</div><div class="status" id="status">준비됨</div></div>
<aside class="card side">
<section><h3>다음 순서</h3><div class="next" id="next"></div></section>
<section><h3>현재 단계 순서</h3><div class="seq" id="seq"></div></section>
<section class="duration-setting" id="durationSetting">
  <span class="duration-label">주도권 시간</span>
  <button class="duration-btn" id="twoMin" type="button">2분</button>
  <button class="duration-btn active" id="threeMin" type="button">3분</button>
</section>
<div class="notice" id="notice"></div>
</aside>
</section>
<section class="controls"><button class="primary" id="start">▶ 시작</button><button id="reset">↺ 현재 시간 초기화</button><button class="green" id="goNext">다음 순서 →</button><button class="red" id="goPrev">← 이전 순서</button><select id="phase"></select></section>
</div><div class="flash" id="flash"></div>
<script>
const phases=[
{t:'입론 발표',k:'1단계',l:'현재 발표',d:180,o:['A팀','B팀','C팀','D팀'],n:'팀별 3분 · 종료 30초 전 알림'},
{t:'주도권 토론 준비 협의',k:'2단계',l:'현재 활동',d:180,o:['전체 팀'],n:'3분 동안 입론 정리와 질문·답변 준비'},
{t:'1차 주도권 토론',k:'3단계',l:'주도 팀',d:180,o:['B팀','C팀','D팀','A팀'],n:'팀별 시간 선택 가능 · 종료 30초 전 알림',adjustable:true},
{t:'2차 주도권 토론 준비 협의',k:'4단계',l:'현재 활동',d:180,o:['전체 팀'],n:'3분 동안 2차 토론 질문과 답변 준비'},
{t:'2차 주도권 토론',k:'5단계',l:'주도 팀',d:180,o:['C팀','D팀','A팀','B팀'],n:'팀별 시간 선택 가능 · 종료 30초 전 알림',adjustable:true},
{t:'최종 발언 준비',k:'6단계',l:'현재 활동',d:180,o:['전체 팀'],n:'3분 동안 최종 발언 준비'},
{t:'최종 발언',k:'7단계',l:'현재 발표',d:120,o:['D팀','A팀','B팀','C팀'],n:'팀별 2분 · 종료 30초 전 알림'}];

let p=0,i=0,timer=null,running=false,warned=false,debateDuration=180;
let left=phases[0].d;
const $=x=>document.getElementById(x);

phases.forEach((x,j)=>{
  $('phase').insertAdjacentHTML('beforeend',`<option value="${j}">${j+1}. ${x.t}</option>`);
});

function currentDuration(){
  return phases[p].adjustable ? debateDuration : phases[p].d;
}

function fmt(s){
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}

function applyTeamColor(team){
  const card=$('timerCard');
  card.classList.remove('team-a','team-b','team-c','team-d','all-teams');
  const map={'A팀':'team-a','B팀':'team-b','C팀':'team-c','D팀':'team-d'};
  card.classList.add(map[team] || 'all-teams');
}

function render(){
  const x=phases[p];
  const currentTeam=x.o[i];

  applyTeamColor(currentTeam);

  $('kicker').textContent=x.k;
  $('title').textContent=x.t;
  $('label').textContent=x.l;
  $('team').textContent=currentTeam;
  $('count').textContent=`${i+1} / ${x.o.length}`;
  $('time').textContent=fmt(left);
  $('notice').textContent=x.n;
  $('phase').value=p;
  $('time').className='time'+(left<=10?' danger':left<=30?' warning':'');
  $('next').textContent=i<x.o.length-1?x.o[i+1]:p<phases.length-1?'다음: '+phases[p+1].t:'전체 종료';
  $('seq').innerHTML=x.o.map((n,j)=>`<span class="pill ${j<i?'done':''} ${j===i?'current':''}">${n}</span>`).join('');

  $('durationSetting').classList.toggle('show',Boolean(x.adjustable));
  $('twoMin').classList.toggle('active',debateDuration===120);
  $('threeMin').classList.toggle('active',debateDuration===180);
}

function beep(f=880,d=.25,c=1){
  try{
    const A=window.AudioContext||window.webkitAudioContext,ctx=new A();
    for(let j=0;j<c;j++){
      const o=ctx.createOscillator(),g=ctx.createGain(),s=ctx.currentTime+j*.35;
      o.frequency.value=f;o.connect(g);g.connect(ctx.destination);
      g.gain.setValueAtTime(.18,s);g.gain.exponentialRampToValueAtTime(.001,s+d);
      o.start(s);o.stop(s+d);
    }
  }catch(e){}
}

function warn(){
  beep(900,.25,2);
  $('flash').classList.remove('show');
  void $('flash').offsetWidth;
  $('flash').classList.add('show');
  $('status').textContent='30초 남았습니다';
}

function pause(){
  running=false;
  clearInterval(timer);
  timer=null;
  $('start').textContent='▶ 계속';
}

function start(){
  if(left<=0)return;
  running=true;
  $('start').textContent='Ⅱ 일시정지';
  $('status').textContent='진행 중';
  timer=setInterval(()=>{
    if(left>0){
      left--;
      if(left===30&&!warned){warned=true;warn();}
      render();
    }else{
      pause();
      beep(520,.5,3);
      $('status').textContent='시간 종료';
      render();
    }
  },1000);
}

function prepareCurrent(){
  pause();
  left=currentDuration();
  warned=false;
  $('start').textContent='▶ 시작';
  $('status').textContent='준비됨';
  render();
}

function reset(){ prepareCurrent(); }

function next(){
  pause();
  const x=phases[p];
  if(i<x.o.length-1)i++;
  else if(p<phases.length-1){p++;i=0;}
  left=currentDuration();
  warned=false;
  $('start').textContent='▶ 시작';
  $('status').textContent='준비됨';
  render();
}

function prev(){
  pause();
  if(i>0)i--;
  else if(p>0){p--;i=phases[p].o.length-1;}
  left=currentDuration();
  warned=false;
  $('start').textContent='▶ 시작';
  $('status').textContent='준비됨';
  render();
}

function setDebateDuration(seconds){
  debateDuration=seconds;
  if(phases[p].adjustable){
    pause();
    left=debateDuration;
    warned=false;
    $('start').textContent='▶ 시작';
    $('status').textContent='준비됨';
  }
  render();
}

$('twoMin').onclick=()=>setDebateDuration(120);
$('threeMin').onclick=()=>setDebateDuration(180);
$('start').onclick=()=>running?pause():start();
$('reset').onclick=reset;
$('goNext').onclick=next;
$('goPrev').onclick=prev;
$('phase').onchange=e=>{
  pause();
  p=+e.target.value;
  i=0;
  left=currentDuration();
  warned=false;
  $('start').textContent='▶ 시작';
  $('status').textContent='준비됨';
  render();
};
$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();

document.onkeydown=e=>{
  if(e.code==='Space'){e.preventDefault();running?pause():start();}
  if(e.key==='ArrowRight')next();
  if(e.key==='ArrowLeft')prev();
  if(e.key.toLowerCase()==='r')reset();
  if(e.key.toLowerCase()==='f')$('fs').click();
};

render();
</script>
</body></html>
